[pytest]
# as pastas dos desenhos começam com dígito (6c2a_...) e não são pacotes: importlib evita conflito de nomes
addopts = --import-mode=importlib -q
testpaths = analises
markers =
    dados_reais: usa os parquets de dados/ (lento; pule com -m "not dados_reais")
    requer_l6: depende dos dados de emendas (L6); pulado enquanto dados/emendas/ estiver vazio
